{% extends "base.html" %}
{% block title %}Login — IPL Analytics{% endblock %}

{% block content %}
<div class="card" style="max-width:460px; margin: 2.5rem auto;">
    <h2>Welcome back</h2>
    <p class="text-muted" style="margin-bottom:1.5rem;">Log in to access your dashboard.</p>

    <form method="POST" action="/login">

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Your password" required>
        </div>

        <button type="submit" class="btn" style="width:100%;">Log In</button>
    </form>

    <p class="text-center mt-1 text-muted">
        No account? <a href="/register" style="color:#e94560;">Register here</a>
    </p>
</div>
{% endblock %}
