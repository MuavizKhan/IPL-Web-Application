{% extends "base.html" %}
{% block title %}Register — IPL Analytics{% endblock %}

{% block content %}
<div class="card" style="max-width:460px; margin: 2.5rem auto;">
    <h2>Create an account</h2>
    <p class="text-muted" style="margin-bottom:1.5rem;">Sign up to access all IPL analytics.</p>

    <form method="POST" action="/register">

        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" placeholder="e.g. cricket_fan" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Min. 6 characters" required>
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" name="confirm" placeholder="Repeat password" required>
        </div>

        <button type="submit" class="btn" style="width:100%;">Register</button>
    </form>

    <p class="text-center mt-1 text-muted">
        Already have an account? <a href="/login" style="color:#e94560;">Log in</a>
    </p>
</div>
{% endblock %}
